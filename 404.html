<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Página não encontrada | M.R. Express</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      background: linear-gradient(135deg, #0b2a5b, #123a7a);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 520px; }
    .code {
      font-size: clamp(6rem, 22vw, 11rem);
      font-weight: 900;
      line-height: 1;
      color: #c8102e;
      text-shadow: 0 10px 40px rgba(200, 16, 46, 0.4);
    }
    h1 { font-size: 1.6rem; margin: 10px 0 14px; }
    p { color: rgba(255,255,255,0.8); margin-bottom: 30px; line-height: 1.6; }
    a {
      display: inline-block;
      background: #c8102e;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      padding: 14px 32px;
      border-radius: 50px;
      transition: 0.3s;
    }
    a:hover { background: #a00d24; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Página não encontrada</h1>
    <p>Ops! A página que você procura não existe ou foi movida.<br />Volte ao início e continue navegando.</p>
    <a href="index.html">Voltar ao início</a>
  </div>
</body>
</html>
